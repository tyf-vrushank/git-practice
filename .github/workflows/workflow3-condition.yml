name: Workflow 3 - Conditional Execution

on:
  push:
    branches:
      - slack-notify/6377

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Start build
        run: |
          echo "=== BUILD STARTED ==="
          date

      - name: Simulate build
        run: |
         sleep 3
         date  
      - name: Simulate success
        run: exit 0
  notify-success:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
        - name: Success message
          run: echo "Build succeeded!"
  notify-failure:
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    steps:
        - name: Failure message
          run: echo "Build failed :("